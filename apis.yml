aid: imbue
name: Imbue
description: >-
  Imbue is a San Francisco AI research lab building agentic foundation models
  for reasoning and the human tooling around them, with a stated mission of AI
  that is loyal to its user. The team trains large reasoning models in-house
  (including a 70B model trained from scratch with open-sourced tooling and
  evaluation datasets) and publishes research on agent and reasoning
  architectures, reinforcement learning, data generation, and the scientific
  theory of deep learning. Imbue ships practical tools that emerge from the
  research, including Sculptor and mngr for orchestrating parallel coding
  agents, Bouncer for filtering social feeds, and Blueprint and Vet. There is
  no public commercial inference API; integration happens through
  open-sourced repositories, model artifacts on Hugging Face, and research
  releases.
